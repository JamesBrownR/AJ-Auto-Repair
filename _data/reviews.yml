- name: Chris Miles
  stars: 5
  text: >
    Jeremy and Andrew at AJ Automotive Services did an amazing job. I had my engine rebuilt and after getting quotes
    from a few other shops, their price was by far the best I could find. Not only was it affordable, but the quality
    of work was top-notch. The car runs better than ever and everything was done professionally and on time. You can
    tell they actually care about their work and don't try to overcharge like a lot of other places. Highly recommend
    them if you're looking for honest pricing and solid work. I'll definitely be coming back 👍
