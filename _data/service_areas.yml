    - slug: oil-change
      service_name: Oil Change
      description: "Professional oil change service in Eustis, FL. Conventional, synthetic, and high-mileage oil changes for all makes and models at AJ Automotive Services. Call (352) 308-8142."
      hero_tagline: "Conventional, synthetic, and high-mileage oil changes for every make and model. Right here in Eustis on Kurt St."
      intro_heading: "Oil Change Service in Eustis, FL"
      intro_content: "<p>AJ Automotive Services is located at 1534 Kurt St in Eustis and performs oil changes on all makes and models. Whether your vehicle takes conventional, full synthetic, synthetic blend, or high-mileage oil, we use the correct formula and filter for your specific engine every time.</p><p>Eustis vehicles deal with Central Florida heat year round, and that heat breaks down oil faster than cooler climates. Staying on your service interval matters more here than drivers in northern states might realize. We see the consequences of stretched intervals regularly and it is always more expensive than the oil change would have been.</p><p>Every oil change includes a multi-point inspection covering brakes, tires, belts, hoses, and all fluid levels. You leave knowing the full condition of your vehicle, not just that the oil is fresh.</p>"
      included_heading: "What's Included with Every Oil Change"
      included_items:
        - name: Conventional Oil Change
          description: Standard motor oil service using the correct viscosity for your engine. Suitable for most older vehicles and lower mileage driving patterns.
        - name: Full Synthetic Oil Change
          description: Superior protection at high temperatures with longer service intervals. Recommended for most modern engines and essential in Florida's heat.
        - name: High-Mileage Oil Change
          description: Formulated for vehicles over 75,000 miles. Reduces oil burn-off, conditions aging seals, and minimizes engine wear on higher mileage engines.
        - name: Synthetic Blend Oil Change
          description: A mix of conventional and synthetic oils offering improved protection over conventional at a lower cost than full synthetic.
        - name: Oil Filter Replacement
          description: We replace your filter with every service. A clogged filter allows contaminants back into the engine and defeats the purpose of fresh oil.
        - name: Multi-Point Inspection
          description: Brakes, tires, belts, hoses, and all fluid levels checked and reported. You know the full condition of your vehicle before you leave.
        - name: Fluid Level Check and Top-Off
          description: Coolant, power steering, brake fluid, transmission fluid, and washer fluid all checked and topped off as needed.
        - name: Tire Pressure Check
          description: All four tires adjusted to manufacturer spec. Correct inflation improves fuel economy, handling, and tire life.
      faqs:
        - question: How often should I get an oil change in Eustis?
          answer: Most vehicles on conventional oil need a change every 3,000 to 5,000 miles. Full synthetic can typically go 7,000 to 10,000 miles. Florida heat accelerates oil breakdown so staying toward the lower end of your interval is wise for Eustis drivers.
        - question: What oil type does my vehicle need?
          answer: The correct oil type and viscosity is in your owner's manual. We look it up for every vehicle and use exactly what your engine requires.
        - question: How long does an oil change take?
          answer: Most oil changes are completed in 30 to 45 minutes at our Eustis shop.
        - question: Do I need an appointment?
          answer: Walk-ins are welcome Monday through Saturday, 8 AM to 6 PM. Calling ahead at (352) 308-8142 helps us get you in faster.

    - slug: auto-brake-repair
      service_name: Brake Repair
      description: "Professional brake repair in Eustis, FL. Brake pads, rotors, calipers, and full brake system service at AJ Automotive Services. Call (352) 308-8142."
      hero_tagline: "Brake pads, rotors, calipers, and complete brake system service. All makes and models. Located in Eustis on Kurt St."
      intro_heading: "Brake Repair in Eustis, FL"
      intro_content: "<p>AJ Automotive Services performs brake repair on all makes and models at our shop on Kurt St in Eustis. From brake pad replacement and rotor resurfacing to caliper repair, brake fluid service, and ABS diagnostics, we handle the full range of brake system work.</p><p>Eustis driving puts real demand on brake systems. Stop-and-go traffic on US-441 and Bay Street accelerates pad and rotor wear, and the humidity here promotes rust on rotors and brake hardware faster than in drier climates. We inspect the entire brake system on every vehicle, not just the component you came in for, so nothing gets missed.</p><p>We diagnose before we recommend. If you hear squealing or grinding, feel a soft pedal, or have a brake warning light on, bring the vehicle in and we will tell you exactly what is needed and what it costs before any work begins.</p>"
      included_heading: "Brake Services We Perform"
      included_items:
        - name: Brake Pad Replacement
          description: We replace worn pads with quality replacements matched to your vehicle's specifications and driving demands.
        - name: Rotor Replacement
          description: Warped, scored, or worn-below-spec rotors are replaced. We measure thickness and runout on every rotor before making a recommendation.
        - name: Caliper Repair and Replacement
          description: Sticking or leaking calipers cause uneven wear and pulling. We rebuild or replace as needed.
        - name: Brake Fluid Service
          description: Brake fluid absorbs moisture over time and loses effectiveness. We flush and replace fluid on the correct service interval.
        - name: ABS Diagnostics
          description: ABS warning lights diagnosed with proper scan tools. We identify the fault and repair the system correctly.
        - name: Brake Line Inspection
          description: We inspect all brake lines and hoses for cracks, corrosion, and leaks that could compromise braking performance.
        - name: Parking Brake Service
          description: Adjustment or repair of the parking brake mechanism to ensure proper holding force.
        - name: Full Brake Inspection
          description: Complete inspection of the entire brake system including pads, rotors, calipers, lines, fluid, and hardware on all four corners.
      faqs:
        - question: How do I know if my brakes need service in Eustis?
          answer: Common signs include squealing or grinding noises, a soft or spongy brake pedal, pulling to one side when braking, vibration through the pedal, or a brake warning light. If you notice any of these, bring the vehicle in.
        - question: How long do brake pads last?
          answer: Typically 25,000 to 65,000 miles depending on driving habits, vehicle weight, and pad material. Stop-and-go driving in Eustis traffic wears pads faster than highway driving.
        - question: Do I need to replace rotors with pads?
          answer: Not always. We measure rotor thickness and check for warping. If rotors are within spec and not scored, pad replacement alone may be sufficient. We will tell you honestly what your rotors need.
        - question: How long does a brake job take?
          answer: A standard pad and rotor replacement on one axle typically takes one to two hours. Full four-wheel brake service takes two to three hours.

    - slug: transmission
      service_name: Transmission Service
      description: "Transmission repair and service in Eustis, FL. Diagnostics, fluid service, repair, and replacement for all makes and models at AJ Automotive Services. Call (352) 308-8142."
      hero_tagline: "Transmission diagnostics, fluid service, repair, and replacement. All makes and models. Located in Eustis on Kurt St."
      intro_heading: "Transmission Service in Eustis, FL"
      intro_content: "<p>AJ Automotive Services handles transmission diagnostics, fluid service, repair, and replacement for all makes and models at our shop in Eustis. Automatic and manual transmissions, front-wheel drive, rear-wheel drive, and all-wheel drive vehicles are all within our scope.</p><p>Transmission problems in Eustis vehicles are often made worse by heat. Florida's climate keeps transmission fluid operating at higher temperatures than in cooler states, which accelerates fluid degradation and wear on internal components. Regular fluid changes are the single best preventive measure for transmission longevity and most drivers skip them far too long.</p><p>If your transmission is slipping, shifting rough, hesitating, or throwing a warning light, we diagnose with proper equipment before recommending any repair. An accurate diagnosis prevents unnecessary work and makes sure the actual problem gets fixed.</p>"
      included_heading: "Transmission Services We Perform"
      included_items:
        - name: Transmission Diagnostics
          description: Comprehensive diagnosis including scan tool data, fluid condition inspection, and road test to identify the root cause of transmission problems.
        - name: Transmission Fluid Service
          description: Drain and refill or full flush depending on your vehicle's service requirements. We use the correct fluid specification for your transmission.
        - name: Transmission Repair
          description: Internal repair of failed components including solenoids, valve bodies, clutch packs, and seals where rebuilding is the appropriate solution.
        - name: Transmission Replacement
          description: Replacement with a remanufactured or new unit when repair is not cost-effective or the damage is too extensive.
        - name: Manual Transmission and Clutch Service
          description: Clutch replacement, flywheel resurfacing, and manual transmission service for stick-shift vehicles.
        - name: Torque Converter Service
          description: Torque converter replacement or rebuild when converter failure is contributing to transmission symptoms.
        - name: Transmission Leak Repair
          description: Identification and repair of pan gaskets, seals, and lines causing external fluid leaks.
        - name: Differential and Drivetrain Service
          description: Differential fluid service and repair for vehicles with separate differentials and four-wheel drive transfer case service.
      faqs:
        - question: What are the signs of transmission trouble?
          answer: Slipping between gears, delayed or rough shifting, shuddering during acceleration, a burning smell, fluid leaks under the vehicle, or a check engine or transmission warning light are all signs to have the transmission inspected.
        - question: How often should transmission fluid be changed?
          answer: Most manufacturers recommend every 30,000 to 60,000 miles, but Florida heat degrades fluid faster. If your fluid is dark brown or smells burned, it is overdue regardless of mileage.
        - question: Is it worth repairing a transmission or should I replace it?
          answer: It depends on the vehicle value, the extent of the damage, and the repair cost. We give you an honest assessment of both options so you can make the right decision for your situation.
        - question: Can I drive with a slipping transmission?
          answer: We recommend against it. Driving with a slipping transmission accelerates damage and what might be a repairable problem can become a full replacement if ignored.

    - slug: ac-installation-repair
      service_name: A/C Repair
      description: "A/C repair and service in Eustis, FL. Diagnostics, recharge, leak repair, and compressor replacement for all makes and models at AJ Automotive Services. Call (352) 308-8142."
      hero_tagline: "A/C diagnostics, recharge, leak repair, and full system service. All makes and models. Located in Eustis on Kurt St."
      intro_heading: "A/C Repair in Eustis, FL"
      intro_content: "<p>AJ Automotive Services performs A/C diagnostics, recharge, leak detection and repair, compressor replacement, and full system service on all makes and models at our shop in Eustis. A working air conditioner is not optional in Central Florida, and we treat A/C repair as the priority service it is for drivers in this climate.</p><p>Eustis summers push vehicle A/C systems hard. High ambient temperatures mean the system runs nearly constantly, compressor wear accumulates faster, and refrigerant leaks that might go unnoticed for months in a cooler climate become immediately apparent here. We diagnose the system properly rather than just recharging and sending you on your way, because a recharge without finding the leak means you will be back in a few months with the same problem.</p><p>If your A/C is blowing warm, cycling on and off, making noise, or just not cooling as well as it used to, bring it in. We will tell you exactly what the system needs and what it costs to fix it right.</p>"
      included_heading: "A/C Services We Perform"
      included_items:
        - name: A/C System Diagnostics
          description: Complete system diagnosis including pressure testing, temperature measurement, and component inspection to identify the root cause of A/C failure.
        - name: Refrigerant Recharge
          description: Recharge with the correct refrigerant type and charge amount for your vehicle. We do not recharge without first diagnosing why the charge was low.
        - name: Leak Detection and Repair
          description: UV dye or electronic leak detection to find refrigerant leaks in hoses, fittings, the condenser, evaporator, or compressor seals.
        - name: Compressor Replacement
          description: A/C compressor replacement when the compressor has failed or is worn beyond reliable operation.
        - name: Condenser Replacement
          description: Replacement of the front-mounted condenser when damaged by road debris or corroded to the point of leaking.
        - name: Evaporator Service
          description: Evaporator replacement or cleaning when the core is leaking or causing odor issues inside the cabin.
        - name: A/C Hose and Line Repair
          description: Replacement of cracked, chafed, or leaking refrigerant hoses and lines throughout the system.
        - name: Cabin Air Filter Replacement
          description: Replacement of the cabin air filter that protects the evaporator and maintains proper airflow through the A/C system.
      faqs:
        - question: Why is my A/C blowing warm air in Eustis?
          answer: The most common causes are low refrigerant from a leak, a failed compressor, a clogged condenser, or an electrical fault. We diagnose the specific cause before recommending any repair.
        - question: Can I just recharge the A/C myself?
          answer: DIY recharge cans top off refrigerant without addressing the leak that caused the loss. This is a short-term fix at best. We find and repair the leak so the charge holds long-term.
        - question: How long does A/C repair take?
          answer: A recharge with leak inspection takes one to two hours. Compressor or condenser replacement typically takes three to five hours depending on the vehicle.
        - question: How often should A/C be serviced in Florida?
          answer: We recommend an A/C inspection every year before summer. Florida systems run harder and longer than in other states and catching small issues in spring prevents breakdowns in July.

    - slug: auto-engine-diagnostics
      service_name: Engine Diagnostics
      description: "Engine diagnostics and repair in Eustis, FL. Check engine light diagnosis, tune-ups, and complete engine repair at AJ Automotive Services. Call (352) 308-8142."
      hero_tagline: "Check engine light diagnosis, tune-ups, and complete engine repair. All makes and models. Located in Eustis on Kurt St."
      intro_heading: "Engine Diagnostics in Eustis, FL"
      intro_content: "<p>AJ Automotive Services performs engine diagnostics and repair on all makes and models at our shop in Eustis. Whether your check engine light came on, your vehicle is running rough, losing power, or using more fuel than normal, we use professional scan tools and hands-on diagnosis to find the actual cause rather than guessing at parts.</p><p>A check engine light does not always mean an expensive repair. It means a sensor has detected a problem and logged a fault code. The code points to a system, not a specific part, and proper diagnosis is required to determine what actually failed. We read the codes, test the indicated system, and verify the root cause before recommending anything.</p><p>Eustis vehicles face specific engine stresses from the heat and humidity. Cooling systems work harder, intake components accumulate more moisture, and rubber hoses and gaskets degrade faster in Florida's climate than in drier regions. We factor these conditions into every diagnosis.</p>"
      included_heading: "Engine Services We Perform"
      included_items:
        - name: Check Engine Light Diagnosis
          description: Full diagnostic scan plus hands-on testing of the indicated system. We find the root cause, not just read the code.
        - name: Tune-Up Service
          description: Spark plug replacement, ignition system inspection, and air and fuel filter service to restore engine performance and fuel economy.
        - name: Engine Repair
          description: Repair of specific engine components including gaskets, sensors, timing components, and mechanical failures identified during diagnosis.
        - name: Engine Replacement
          description: Complete engine replacement with a remanufactured or new unit when repair is not cost-effective.
        - name: Timing Belt and Chain Service
          description: Replacement of timing belts and chains on the manufacturer's recommended interval before failure causes engine damage.
        - name: Fuel System Service
          description: Fuel injector cleaning, fuel filter replacement, and fuel pump diagnosis and replacement.
        - name: Cooling System Service
          description: Coolant flush, thermostat replacement, radiator repair, and water pump service to prevent overheating.
        - name: Engine Tuning
          description: Optimization of engine performance parameters including ignition timing and fuel delivery for vehicles that benefit from tuning.
      faqs:
        - question: What does a check engine light mean?
          answer: It means a sensor has detected a problem outside normal parameters and stored a fault code. It could be anything from a loose gas cap to a misfiring cylinder. The only way to know is a proper diagnosis.
        - question: Can I drive with the check engine light on?
          answer: If the light is steady and the vehicle is driving normally, it is generally safe to drive for a short period but should be diagnosed soon. If the light is flashing, reduce speed and have it checked immediately as a flashing light indicates active engine misfires that can damage the catalytic converter.
        - question: How long does an engine diagnostic take?
          answer: Initial scanning and diagnosis typically takes one to two hours. Complex issues or intermittent faults may require additional time.
        - question: Do you work on both domestic and foreign engines?
          answer: Yes. We work on all makes and models including Honda, Toyota, Ford, Chevrolet, Nissan, Jeep, BMW, Mercedes-Benz, and more.

    - slug: electrical
      service_name: Electrical Repair
      description: "Auto electrical repair in Eustis, FL. Battery, alternator, starter, wiring, and vehicle computer diagnostics at AJ Automotive Services. Call (352) 308-8142."
      hero_tagline: "Battery, alternator, starter, wiring, and computer system diagnostics. All makes and models. Located in Eustis on Kurt St."
      intro_heading: "Electrical Repair in Eustis, FL"
      intro_content: "<p>AJ Automotive Services diagnoses and repairs electrical problems on all makes and models at our shop in Eustis. From dead batteries and failed alternators to complex wiring faults and vehicle computer issues, we have the diagnostic equipment and experience to track down electrical problems accurately.</p><p>Electrical issues in Eustis vehicles are frequently accelerated by the local climate. Florida humidity promotes corrosion in connectors, terminals, and ground points, and the heat degrades wire insulation faster than in cooler regions. We see corrosion-related electrical faults regularly and know where to look for them on vehicles that have spent years in Lake County conditions.</p><p>Electrical diagnosis requires more than a code reader. Tracking down an intermittent fault or a parasitic drain requires systematic testing with proper equipment. We do not replace parts and hope for the best. We test, verify, and repair with confidence.</p>"
      included_heading: "Electrical Services We Perform"
      included_items:
        - name: Battery Testing and Replacement
          description: Load testing to determine true battery health followed by replacement with the correct group size and cold cranking amp rating for your vehicle.
        - name: Alternator Service
          description: Alternator output testing and replacement when the alternator is no longer maintaining proper charging voltage.
        - name: Starter Repair and Replacement
          description: Diagnosis and replacement of failed starters causing no-crank or slow-crank conditions.
        - name: Electrical Diagnostics
          description: Systematic diagnosis of shorts, opens, and high-resistance faults in vehicle wiring using professional test equipment.
        - name: Wiring Repair
          description: Repair of damaged, corroded, or chafed wiring including connector replacement and proper splice repair.
        - name: Lighting Repair
          description: Headlights, taillights, turn signals, brake lights, and interior lighting diagnosis and repair.
        - name: Computer System Diagnostics
          description: Diagnosis of faults in engine control modules, body control modules, transmission control modules, and other vehicle computers.
        - name: Charging System Service
          description: Complete evaluation of the charging system including battery, alternator, voltage regulator, and all related wiring.
      faqs:
        - question: How do I know if my battery needs replacing?
          answer: Signs include slow cranking, dimming lights when starting, a battery warning light, or a battery that repeatedly goes dead. We load test every battery to determine its true condition rather than guessing based on age.
        - question: What causes electrical problems in Florida vehicles?
          answer: Humidity-driven corrosion in connectors and terminals is the most common cause we see in Eustis vehicles. Heat also degrades wire insulation and causes premature failure of electronic components.
        - question: How long does electrical diagnosis take?
          answer: Simple faults like a bad battery or alternator can be confirmed in under an hour. Complex wiring faults or intermittent issues may require several hours of systematic testing.
        - question: Can a bad battery cause other electrical problems?
          answer: Yes. A weak battery that cannot maintain proper voltage causes all kinds of secondary issues including check engine lights, transmission shifting problems, and module communication faults. Always test the battery first.

    - slug: steering-suspension-repair
      service_name: Steering and Suspension Repair
      description: "Steering and suspension repair in Eustis, FL. Shocks, struts, alignment, ball joints, and full suspension service at AJ Automotive Services. Call (352) 308-8142."
      hero_tagline: "Shocks, struts, alignment, ball joints, and complete steering and suspension service. All makes and models. Located in Eustis on Kurt St."
      intro_heading: "Steering and Suspension Repair in Eustis, FL"
      intro_content: "<p>AJ Automotive Services performs steering and suspension repair on all makes and models at our shop in Eustis. Shocks, struts, ball joints, tie rods, control arms, wheel alignment, and power steering service are all within our scope.</p><p>Eustis roads and driving conditions put consistent stress on suspension systems. US-441 and the surrounding county roads carry heavy traffic loads that degrade road surfaces over time, and the railroad crossings and rough patches around the Eustis area are hard on shocks and struts. We see worn suspension components regularly on local vehicles and know what to inspect to catch wear before it affects handling or causes tire damage.</p><p>Suspension problems affect more than ride comfort. Worn shocks and struts increase stopping distance, misalignment causes rapid tire wear, and loose ball joints or tie rods are a safety issue. We do a complete inspection and tell you exactly what needs attention.</p>"
      included_heading: "Steering and Suspension Services We Perform"
      included_items:
        - name: Shock and Strut Replacement
          description: Replacement of worn or leaking shocks and struts to restore proper ride control, handling, and braking performance.
        - name: Ball Joint Replacement
          description: Inspection and replacement of upper and lower ball joints when worn beyond specification.
        - name: Tie Rod Replacement
          description: Inner and outer tie rod replacement when play or wear is causing looseness or pulling.
        - name: Control Arm and Bushing Service
          description: Control arm replacement or bushing replacement when worn bushings are causing handling issues or noise.
        - name: Wheel Alignment
          description: Four-wheel alignment to manufacturer specifications to prevent tire wear and restore straight tracking.
        - name: Sway Bar Link and Bushing Replacement
          description: Replacement of worn sway bar links and bushings causing clunking or poor cornering stability.
        - name: Power Steering Service
          description: Power steering fluid flush and replacement, pump diagnosis, and rack and pinion inspection and repair.
        - name: Full Suspension Inspection
          description: Complete inspection of all suspension and steering components with a written report of findings and recommendations.
      faqs:
        - question: How do I know if my suspension needs repair?
          answer: Signs include a rough or bouncy ride, vehicle pulling to one side, uneven tire wear, clunking or squeaking over bumps, or a steering wheel that vibrates or feels loose.
        - question: How often should I get an alignment?
          answer: We recommend checking alignment annually or after any significant impact such as hitting a large pothole or curb. Misalignment is the leading cause of premature tire wear.
        - question: Do I need to replace shocks and struts in pairs?
          answer: Yes. Replacing only one side creates an imbalance in handling and braking. Shocks and struts should always be replaced in axle pairs.
        - question: Can bad suspension damage my tires?
          answer: Yes. Misalignment, worn shocks, and loose components all cause abnormal tire wear patterns that significantly shorten tire life.

    - slug: battery
      service_name: Battery Service
      description: "Battery testing and replacement in Eustis, FL. All makes and models at AJ Automotive Services. Call (352) 308-8142."
      hero_tagline: "Battery testing, replacement, and charging system service. All makes and models. Located in Eustis on Kurt St."
      intro_heading: "Battery Service in Eustis, FL"
      intro_content: "<p>AJ Automotive Services performs battery testing, replacement, and charging system service on all makes and models at our shop in Eustis. We use proper load testing equipment to determine the true condition of your battery rather than guessing based on age or a simple voltage check.</p><p>Florida heat is one of the harshest environments for automotive batteries. High temperatures accelerate internal plate degradation and evaporate electrolyte, which is why batteries fail sooner in Florida than in cooler climates. Most batteries last three to four years here compared to five or more in northern states. If your battery is more than three years old, it is worth having it tested before you end up stranded.</p><p>A failing battery also causes a range of secondary problems that are easy to misdiagnose. Check engine lights, erratic shifting, and module communication faults can all be traced back to a battery that can no longer maintain proper voltage. We test the battery first on any electrical complaint before diagnosing further.</p>"
      included_heading: "Battery Services We Perform"
      included_items:
        - name: Battery Load Testing
          description: Proper load testing that evaluates true battery capacity under demand, not just resting voltage.
        - name: Battery Replacement
          description: Replacement with the correct group size and cold cranking amp rating for your vehicle, with proper disposal of the old battery.
        - name: Terminal and Cable Service
          description: Cleaning or replacement of corroded terminals and cables that cause resistance and poor connection.
        - name: Charging System Test
          description: Alternator output and voltage regulator testing to confirm the charging system is keeping the battery properly charged.
        - name: Parasitic Drain Diagnosis
          description: Systematic testing to identify excessive key-off current draw that is killing the battery overnight.
        - name: Starter and Alternator Testing
          description: Load testing of the starter motor and alternator to confirm they are within specification.
        - name: Battery Registration and Coding
          description: For vehicles that require battery registration after replacement, we perform the coding procedure to prevent charging system faults.
        - name: Spare and Auxiliary Battery Service
          description: Testing and service of auxiliary batteries in trucks, RVs, and vehicles with dual battery setups.
      faqs:
        - question: How long do batteries last in Eustis, FL?
          answer: Typically three to four years in Florida's heat compared to five or more years in cooler climates. Heat degrades batteries faster than cold, which is the opposite of what most people assume.
        - question: Can I test my battery myself?
          answer: A basic voltage check tells you very little. A battery can show 12.6 volts at rest and still fail under load. Professional load testing is the only reliable way to evaluate battery health.
        - question: Will a new battery fix my check engine light?
          answer: Sometimes. A battery that cannot maintain proper voltage causes all kinds of secondary fault codes. We test the battery first on any electrical complaint before pursuing other diagnosis.
        - question: How long does battery replacement take?
          answer: Most battery replacements are completed in 30 minutes or less. Vehicles requiring battery registration take slightly longer.

    - slug: exhaust
      service_name: Exhaust Repair
      description: "Exhaust repair and service in Eustis, FL. Muffler, catalytic converter, exhaust pipe, and full system service at AJ Automotive Services. Call (352) 308-8142."
      hero_tagline: "Muffler repair, catalytic converter replacement, and full exhaust system service. All makes and models. Located in Eustis on Kurt St."
      intro_heading: "Exhaust Repair in Eustis, FL"
      intro_content: "<p>AJ Automotive Services performs exhaust repair and replacement on all makes and models at our shop in Eustis. Mufflers, catalytic converters, exhaust pipes, manifolds, and oxygen sensors are all within our scope.</p><p>Exhaust systems on Eustis vehicles take a beating from the local environment. The humidity and rainfall in Central Florida accelerate rust on exhaust components, and the stop-and-go driving on 441 and through town keeps exhaust temperatures cycling repeatedly which stresses joints, flanges, and hangers. We see rust-through and failing hangers regularly on vehicles that have spent several years in Lake County conditions.</p><p>A failing exhaust system is not just a noise problem. Exhaust leaks before the oxygen sensors affect fuel trim and can trigger a check engine light. A failing catalytic converter causes emissions failures and power loss. We inspect the entire system and tell you honestly what needs repair and what can wait.</p>"
      included_heading: "Exhaust Services We Perform"
      included_items:
        - name: Full Exhaust Inspection
          description: Visual and auditory inspection of the entire exhaust system from manifold to tailpipe including all hangers, joints, and heat shields.
        - name: Muffler Repair and Replacement
          description: Repair of minor damage or full muffler replacement when the muffler is rusted through, damaged, or causing excessive noise.
        - name: Catalytic Converter Replacement
          description: Replacement of failed or stolen catalytic converters with units that meet emissions requirements.
        - name: Exhaust Pipe Repair and Replacement
          description: Section repair or full pipe replacement for rusted, cracked, or leaking exhaust pipes.
        - name: Exhaust Manifold Service
          description: Manifold inspection and replacement when cracked or warped manifolds are causing exhaust leaks and noise.
        - name: Manifold Gasket Replacement
          description: Replacement of blown exhaust manifold gaskets causing ticking or exhaust smell in the engine bay.
        - name: Hanger and Mount Repair
          description: Replacement of broken or deteriorated exhaust hangers and rubber mounts that allow the system to contact the undercarriage.
        - name: Oxygen Sensor Replacement
          description: Upstream and downstream O2 sensor replacement when sensors are failing and affecting fuel economy or causing check engine lights.
      faqs:
        - question: How do I know if I have an exhaust leak?
          answer: Signs include a ticking or popping sound from the engine bay that increases with RPM, a sulfur or exhaust smell inside the cabin, a check engine light, or a loud rumbling exhaust note.
        - question: Is a loud exhaust illegal in Florida?
          answer: Florida law requires vehicles to have a muffler that prevents excessive or unusual noise. Vehicles without proper mufflers can be cited. Beyond the legal issue, a loud exhaust usually indicates a problem that will only get worse.
        - question: Will an exhaust leak affect fuel economy?
          answer: Yes. Leaks before the oxygen sensors cause the engine computer to misread exhaust content and adjust fuel delivery incorrectly, which reduces fuel economy and can trigger fault codes.
        - question: How long does exhaust repair take?
          answer: Minor repairs and muffler replacement typically take one to two hours. More extensive exhaust work or catalytic converter replacement may take two to four hours.

