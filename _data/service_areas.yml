      intro_content: "<p>AJ Automotive Services performs comprehensive vehicle safety inspections on all makes and models at our shop in Eustis. Whether you are buying a used vehicle, preparing for a long trip, or just want to know the full condition of your car, we do a thorough inspection and give you a complete written report of what we find.</p><p>A proper safety inspection covers every system that affects the safety and reliability of the vehicle. Brakes, tires, steering, suspension, lights, fluids, belts, hoses, exhaust, and structural components are all evaluated. For Eustis drivers considering a used vehicle purchase, a pre-purchase inspection is one of the most valuable services we offer, potentially saving thousands by identifying problems before you sign.</p><p>Florida vehicles have specific issues that inspection uncovers regularly. Rust on exhaust and underbody components from humidity, UV-damaged rubber components, overworked cooling systems, and brake corrosion are all common findings on local vehicles. We know what to look for on cars that have spent years in Central Florida conditions.</p>"
      included_heading: "What We Inspect"
      included_items:
        - name: Brake System Inspection
          description: Pad and rotor measurements, caliper condition, brake lines and hoses, fluid condition, and ABS system check.
        - name: Tire and Wheel Inspection
          description: Tread depth measurement, tire condition and age, inflation check, and wheel condition evaluation.
        - name: Steering and Suspension Inspection
          description: All steering and suspension components checked for wear, looseness, and damage including ball joints, tie rods, and shocks.
        - name: Lighting and Electrical Inspection
          description: All exterior and interior lighting checked, battery load tested, and charging system evaluated.
        - name: Fluid and Leak Inspection
          description: All fluid levels and conditions checked, entire undercarriage inspected for active leaks.
        - name: Belts and Hoses Inspection
          description: Condition and tension of all drive belts and coolant hoses inspected for cracking, wear, and deterioration.
        - name: Exhaust System Inspection
          description: Full exhaust system inspected for leaks, rust, and structural integrity from manifold to tailpipe.
        - name: Pre-Purchase Inspection
          description: Comprehensive inspection specifically for used vehicle buyers. Full written report of all findings to inform your purchase decision.
      faqs:
        - question: How long does a safety inspection take?
          answer: A thorough safety inspection takes approximately one to one and a half hours. Pre-purchase inspections may take slightly longer depending on the vehicle's complexity.
        - question: What does a pre-purchase inspection include?
          answer: Everything in our standard safety inspection plus a more detailed evaluation of wear items, hidden damage, prior accident evidence, and fluid condition that helps you understand the true condition of a used vehicle.
        - question: Can I bring a vehicle I am considering buying to your shop?
          answer: Yes. We encourage it. Most sellers will allow a prospective buyer to have a vehicle inspected before purchase. If a seller refuses, that is a red flag in itself.
        - question: Do you provide a written report?
          answer: Yes. We provide a written summary of all findings, categorized by what needs immediate attention, what should be addressed soon, and what is in acceptable condition.

    - slug: auto-emissions-testing
      service_name: Emissions Testing
      description: "Auto emissions testing in Eustis, FL. OBD-II inspection, check engine light diagnosis, and emissions failure repair at AJ Automotive Services. Call (352) 308-8142."
      hero_tagline: "Emissions testing, OBD-II inspection, and emissions failure diagnosis. All makes and models. Located in Eustis on Kurt St."
      intro_heading: "Emissions Testing in Eustis, FL"
      intro_content: "<p>AJ Automotive Services performs auto emissions testing and emissions failure diagnosis on all makes and models at our shop in Eustis. If your vehicle failed an emissions test or has a check engine light preventing it from passing, we diagnose the cause and repair it so your vehicle meets Florida's requirements.</p><p>Lake County uses an OBD-II emissions inspection program. Your vehicle's onboard diagnostic system is scanned for active fault codes, and any stored codes or readiness monitors that have not completed will cause a failure. A check engine light is an automatic failure regardless of the underlying cause.</p><p>Eustis drivers sometimes chase emissions failures without proper diagnosis and end up replacing parts that do not fix the problem. The fault code is a starting point, not a diagnosis. We test the indicated system, verify the root cause, and repair it correctly so the vehicle passes on the next inspection cycle.</p>"
      included_heading: "Emissions Services We Perform"
      included_items:
        - name: OBD-II Emissions Inspection
          description: Scan of your vehicle's onboard diagnostic system for fault codes and readiness monitor status prior to official testing.
        - name: Check Engine Light Diagnosis
          description: Full diagnosis of fault codes including hands-on testing to identify the root cause rather than guessing at parts.
        - name: Emissions Failure Diagnosis
          description: Specific diagnosis of the issues causing an emissions test failure with a clear repair recommendation.
        - name: Catalytic Converter Inspection
          description: Efficiency testing and inspection of catalytic converters that are triggering P0420 or P0430 fault codes.
        - name: Oxygen Sensor Testing and Replacement
          description: Testing of upstream and downstream O2 sensors causing fuel trim issues or emissions-related fault codes.
        - name: EVAP System Diagnosis
          description: Diagnosis of evaporative emission control system faults including purge valves, vent valves, and leak detection.
        - name: Drive Cycle Completion
          description: Guidance on completing the OBD-II drive cycle to set all readiness monitors before retesting after a repair.
        - name: Pre-Inspection Check
          description: Pre-inspection scan to identify any issues before you go for your official emissions test, saving you a failed inspection fee.
      faqs:
        - question: Why did my vehicle fail the emissions test?
          answer: The most common causes are an active check engine light, incomplete OBD-II readiness monitors, a failed catalytic converter, or an EVAP system leak. We can diagnose exactly which issue caused your failure.
        - question: Can I pass emissions with a check engine light on?
          answer: No. Any active check engine light is an automatic failure in Florida's OBD-II inspection program regardless of what is causing it.
        - question: How long does it take to pass emissions after a repair?
          answer: After a repair, the vehicle needs to complete an OBD-II drive cycle to reset the readiness monitors. This typically takes several days of normal driving. We can explain the specific drive cycle for your vehicle.
        - question: My vehicle just had its battery replaced. Will it pass emissions?
          answer: Probably not immediately. Replacing the battery clears the readiness monitors and the vehicle needs to complete a drive cycle to reset them. Plan to drive normally for several days before going for the inspection.

    - slug: tire-rotations
      service_name: Tire Rotation
      description: "Tire rotation service in Eustis, FL. Regular rotations extend tread life and maintain even wear for all makes and models at AJ Automotive Services. Call (352) 308-8142."
      hero_tagline: "Tire rotations, tread inspection, and pressure adjustment. All makes and models. Located in Eustis on Kurt St."
      intro_heading: "Tire Rotation in Eustis, FL"
      intro_content: "<p>AJ Automotive Services performs tire rotations on all makes and models at our shop in Eustis. Regular rotations are one of the most cost-effective services you can do for your vehicle, extending tire life significantly by equalizing wear across all four positions.</p><p>Florida heat accelerates rubber degradation on tires, and the driving patterns in Eustis including the stop-and-go on US-441 and Bay Street put disproportionate wear on front tires in front-wheel drive vehicles. Without regular rotations, front tires often wear out in half the miles of the rears, forcing early replacement of just two tires instead of the full set at maximum mileage.</p><p>Every rotation at AJ Automotive includes a tread depth measurement on all four tires, a tire condition inspection, and inflation adjustment to manufacturer spec. We also torque the lug nuts correctly after reinstallation, which prevents warped rotors from overtightening.</p>"
      included_heading: "What's Included with Every Tire Rotation"
      included_items:
        - name: Tire Rotation
          description: Correct rotation pattern for your vehicle's drivetrain. Front-wheel drive, rear-wheel drive, all-wheel drive, and directional tires each follow a different pattern.
        - name: Tread Depth Measurement
          description: We measure tread depth on all four tires and report where each one stands so you know how much life remains.
        - name: Tire Condition Inspection
          description: Each tire inspected for sidewall damage, bulges, cracking, embedded objects, and abnormal wear patterns.
        - name: Tire Pressure Adjustment
          description: All four tires adjusted to manufacturer spec. Florida heat increases tire pressure and regular adjustment is important.
        - name: Lug Nut Torque
          description: Lug nuts torqued to manufacturer specification after reinstallation to prevent warped rotors and ensure safe seating.
        - name: Wheel and Rim Inspection
          description: Rims and wheels inspected for cracks, bends, and corrosion that could affect tire seating or air retention.
        - name: Spare Tire Check
          description: Spare tire condition and inflation checked so you are not caught with a flat spare when you need it.
        - name: Rotation Interval Note
          description: We record your mileage at every rotation so we can track your interval and remind you when the next one is due.
      faqs:
        - question: How often should I rotate tires in Eustis?
          answer: Every 5,000 to 7,500 miles, which for most drivers is every other oil change. Florida heat accelerates rubber wear so staying consistent with rotations matters more here than in cooler climates.
        - question: Does it matter which way the tires rotate?
          answer: Yes. The correct pattern depends on your drivetrain and whether your tires are directional. We use the right pattern for your specific vehicle every time.
        - question: How long does a tire rotation take?
          answer: Most rotations are completed in 30 to 45 minutes at our Eustis shop.
        - question: Do tire rotations really make a difference?
          answer: Significantly. Front tires on a front-wheel drive vehicle wear two to three times faster than rears without rotation. Regular rotations keep all four tires wearing evenly so you replace a full set at maximum mileage rather than two tires prematurely.
    
    - slug: air-cabin-filter-replacement
      service_name: Air and Cabin Filter Replacement
      description: "Air filter and cabin air filter replacement in Eustis, FL. Engine air filters and cabin filters for all makes and models at AJ Automotive Services. Call (352) 308-8142."
      hero_tagline: "Engine air filters and cabin air filters for all makes and models. Right here in Eustis on Kurt St."
      intro_heading: "Air and Cabin Filter Replacement in Eustis, FL"
      intro_content: "<p>AJ Automotive Services is located at 1534 Kurt St in Eustis and replaces engine air filters and cabin air filters on all makes and models. Both services are quick, but the difference between a clean filter and a clogged one is real performance, fuel economy, and air quality inside your vehicle.</p><p>Eustis vehicles deal with heavy pollen from the surrounding lakes and wooded areas, plus the dust that comes with Central Florida's dry season. Engine air filters here often need attention before the manufacturer's general mileage interval, especially for vehicles parked outside or driven on unpaved roads around Lake County.</p><p>The cabin air filter affects the air you breathe inside the vehicle. In Florida's humidity, a long-overdue cabin filter can grow mold and produce a musty smell from the vents. We check both filters at every service visit and tell you honestly where yours stand.</p>"
      included_heading: "What We Do"
      included_items:
        - name: Engine Air Filter Replacement
          description: Correct filter for your make, model, and engine. Restores proper airflow and engine protection.
        - name: Cabin Air Filter Replacement
          description: Replaces the filter cleaning air entering your cabin through the HVAC system. Improves airflow and removes allergens and odors.
        - name: Filter Condition Inspection
          description: We inspect both filters and show you what we find. We do not replace filters that do not need it.
        - name: Filter Interval Recommendation
          description: Realistic guidance on when each filter should be checked again based on your driving conditions.
      faqs:
        - question: How often do air filters need replacement in Eustis?
          answer: Engine air filters typically every 15,000 to 30,000 miles, but Eustis vehicles driven during heavy pollen season or on unpaved roads often need them sooner. Cabin filters every 15,000 to 25,000 miles. We check both at every service and tell you where yours stand.
        - question: Why does my A/C smell musty in Eustis?
          answer: A dirty cabin air filter combined with Florida humidity is the most common cause. Mold grows quickly in a clogged, damp filter. Replacing it and running fresh air mode for a few minutes usually clears it.
        - question: How long does filter replacement take?
          answer: Both filters combined typically take 20 to 30 minutes at our Eustis shop.
        - question: Do you carry filters for all vehicles?
          answer: We carry or source the correct filters for all makes and models. Call ahead if you want to confirm availability for your specific vehicle.

    - slug: engine-repair
      service_name: Engine Repair
      description: "Engine repair and diagnostics in Eustis, FL. From minor repairs to major engine work on all makes and models at AJ Automotive Services. Call (352) 308-8142."
      hero_tagline: "Engine diagnostics and repair for all makes and models. Right here in Eustis on Kurt St."
      intro_heading: "Engine Repair in Eustis, FL"
      intro_content: "<p>AJ Automotive Services is located at 1534 Kurt St in Eustis and performs engine diagnostics and repair on all makes and models, foreign and domestic. Engine problems range from a faulty sensor to a failing head gasket to internal wear. We diagnose accurately before recommending any repair so you know exactly what you are dealing with.</p><p>Central Florida heat is hard on engines. Oil breaks down faster, cooling systems work harder, and rubber components in the engine bay age more quickly than in cooler climates. We see a consistent pattern of heat-related engine problems on Eustis vehicles, particularly overheating issues, oil leaks from hardened gaskets and seals, and cooling system failures that were ignored until they caused secondary damage.</p><p>We give you a straight assessment of what the repair involves, what it will cost, and whether it makes sense for your vehicle before any work begins.</p>"
      included_heading: "Engine Services We Perform"
      included_items:
        - name: Engine Diagnostics
          description: OBD-II scanning and hands-on testing to find the actual cause of the problem.
        - name: Head Gasket Repair
          description: Diagnosis and repair of head gasket failures including cylinder head resurfacing when needed.
        - name: Timing Belt and Chain Service
          description: Replacement of timing components with tensioners, pulleys, and water pump inspected at the same time.
        - name: Oil Leak Repair
          description: Valve cover gaskets, rear main seals, oil pan gaskets, and other leak sources diagnosed and repaired.
        - name: Cooling System Repair
          description: Thermostat, water pump, radiator, and coolant service to prevent overheating damage.
        - name: Engine Mount Replacement
          description: Worn mount diagnosis and replacement to eliminate vibration and protect surrounding components.
        - name: Internal Engine Repair
          description: Compression testing, piston rings, valve train, and bearing work for engines with internal wear.
        - name: Engine Replacement
          description: Full engine swap with remanufactured, rebuilt, or used engine options discussed honestly.
      faqs:
        - question: How does Eustis heat affect engines?
          answer: Florida heat accelerates oil breakdown, hardens rubber seals and gaskets, and forces cooling systems to work at their limits. We see more heat-related engine problems in Central Florida than shops in cooler climates. Staying on oil change intervals and addressing cooling system maintenance on schedule prevents most of it.
        - question: My check engine light is on. How serious is it?
          answer: It depends on what triggered it. Some faults are minor, others need prompt attention, and a flashing check engine light means an active misfire that should not be driven on. We scan and diagnose to tell you exactly what you are dealing with.
        - question: How long does engine repair take?
          answer: Depends on the repair. A thermostat is same day. A head gasket is typically two to three days. An engine replacement is three to five days depending on parts availability.
        - question: Do you work on all makes and models?
          answer: Yes. Foreign and domestic including Honda, Toyota, Ford, Chevrolet, Dodge, Nissan, Jeep, GMC, Kia, Hyundai, Subaru, BMW, Mercedes-Benz, and more.

    - slug: auto-water-leak-repair
      service_name: Auto Water Leak Repair
      description: "Auto water leak diagnosis and repair in Eustis, FL. Wet carpets, water intrusion, and leak sources found and fixed on all makes and models at AJ Automotive Services. Call (352) 308-8142."
      hero_tagline: "Water leak diagnosis and repair for all makes and models. Right here in Eustis on Kurt St."
      intro_heading: "Auto Water Leak Repair in Eustis, FL"
      intro_content: "<p>AJ Automotive Services is located at 1534 Kurt St in Eustis and diagnoses and repairs vehicle water leaks on all makes and models. Water intrusion is a more serious problem in Florida than in drier climates. The combination of heavy rainfall, high humidity, and intense heat means a slow leak that might stay dormant elsewhere will produce mold and corrosion quickly in Eustis conditions.</p><p>We see water leaks regularly on Eustis vehicles, particularly from deteriorated door and window seals that have been baked by the sun, clogged sunroof drains packed with debris from surrounding trees, and HVAC drain lines that back up during the rainy season. The source is often not where the water appears, which is why systematic diagnosis is the only reliable way to find it.</p><p>We locate the entry point, tell you what the repair involves and what it will cost, and fix it correctly before the secondary damage gets expensive.</p>"
      included_heading: "Water Leak Services We Perform"
      included_items:
        - name: Water Leak Diagnosis
          description: Systematic inspection to find the actual entry point before any repair is recommended.
        - name: Door and Window Seal Replacement
          description: Weatherstripping and rubber seals degraded by Florida sun and heat replaced to restore a watertight barrier.
        - name: Windshield and Rear Glass Seal Repair
          description: Failed seals around glass resealed or replaced to stop water running into the headliner and carpet.
        - name: Sunroof Drain Cleaning and Repair
          description: Clogged sunroof drain tubes cleared and inspected for cracks or disconnections.
        - name: HVAC Drain Line Service
          description: Evaporator drain cleared to stop condensation from backing up onto the passenger floor.
        - name: Firewall and Body Grommet Repair
          description: Deteriorated grommets at wiring and cable pass-throughs replaced to seal the cabin.
      faqs:
        - question: Why are water leaks more common in Eustis than in other parts of the country?
          answer: Florida's UV intensity degrades rubber seals and weatherstripping faster than in cooler or less sunny climates. The heavy summer rainfall gives those degraded seals more opportunities to fail. And the heat and humidity mean any water that gets in creates mold within days rather than weeks.
        - question: Water is on my passenger floor but it has not rained. What is it?
          answer: Most likely a clogged HVAC evaporator drain. The A/C system removes moisture from the air and that condensation has to drain somewhere. When the drain line clogs, water backs up into the cabin. It is a common Florida problem during heavy A/C use season.
        - question: How do you find where the leak is coming from?
          answer: We do a systematic water test starting at the most likely entry points and trace the path from where the water appears back to where it enters. The visible wet spot is usually not the entry point.
        - question: How long does water leak repair take?
          answer: Diagnosis is one to two hours. Repair time depends on what we find. A clogged drain line is quick. A windshield reseal or full weatherstripping replacement takes longer. We give you a specific estimate once the source is identified.

