<style>
    /* Dropdown styling */
    nav ul {
        position: relative;
    }
    
    nav li {
        position: relative;
    }
    
    .dropdown {
        position: relative;
        display: inline-block;
    }
    
    .dropdown-content {
        display: none;
        position: absolute;
        background-color: var(--primary-dark);
        min-width: 250px;
        box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.3);
        z-index: 1000;
        border: 2px solid var(--accent-gold);
        border-radius: 4px;
        top: 100%;
        left: 0;
    }
    
    .dropdown-content a {
        color: var(--text-light);
        padding: 12px 16px;
        text-decoration: none;
        display: block;
        border-bottom: 1px solid #444;
        transition: 0.3s;
    }
    
    .dropdown-content a:last-child {
        border-bottom: none;
    }
    
    .dropdown-content a:hover {
        background-color: var(--primary-light);
        color: var(--accent-gold);
    }
    
    .dropdown:hover .dropdown-content {
        display: block;
    }
    
    .dropdown > a::after {
        content: " ▼";
        font-size: 0.7em;
        margin-left: 5px;
    }
</style>
